<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ richtung }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titel }}</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
        }

        a {
            color: #94a3b8;
        }

        input,
        select {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 8px 20px;
            background-color: #38bdf8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .lang-switch a.aktiv {
            color: #38bdf8;
            font-weight: bold;
        }

        /* Formulare: Label, Feld, Bereichs-Hinweis und rote Fehlermeldung */
        .feld {
            margin: 12px auto;
            width: min(320px, 90%);
            text-align: start;
        }

        .feld label {
            display: block;
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .feld input[type=text],
        .feld input[type=number],
        .feld select {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
        }

        .hinweis {
            display: block;
            color: #94a3b8;
            font-size: 0.8em;
            margin-top: 2px;
        }

        .fehler {
            color: #f87171;
            font-size: 0.85em;
            min-height: 1.2em;
            margin-top: 2px;
        }

        .ungueltig {
            outline: 2px solid #f87171;
        }

        .fehler-box {
            background: #450a0a;
            border: 1px solid #f87171;
            color: #fecaca;
            border-radius: 6px;
            padding: 8px 12px;
            margin: 10px auto;
            width: min(320px, 90%);
        }

        .check {
            display: block;
            margin: 6px auto;
            width: min(320px, 90%);
            text-align: start;
        }

        /* Ergebnis-Seite: Risikokategorie (immer mit Text, nicht nur Farbe), Hinweise, Notfall */
        .kat {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            font-weight: 600;
            border: 1px solid transparent;
        }

        .kat-niedrig { background: #064e3b; color: #a7f3d0; border-color: #34d399; }
        .kat-mittel { background: #451a03; color: #fde68a; border-color: #fbbf24; }
        .kat-hoch { background: #450a0a; color: #fecaca; border-color: #f87171; }

        .tipps {
            display: inline-block;
            max-width: min(520px, 92%);
            text-align: start;
            line-height: 1.5;
        }

        .notfall {
            margin: 14px auto;
            max-width: min(520px, 92%);
            padding: 8px 12px;
            border-inline-start: 4px solid #f87171;
            background: #1e293b;
            text-align: start;
        }
    </style>
</head>

<body>
    {% if zeige_sprachen %}
    <div class="lang-switch">
        {% for code in sprachen %}
        <a href="{{ sprach_pfad }}?lang={{ code }}" {% if code == lang %}class="aktiv" {% endif %}>{{ code|upper }}</a>{% if not loop.last %} | {% endif %}
        {% endfor %}
    </div>
    {% endif %}
    {% block inhalt %}{% endblock %}
</body>

</html>
