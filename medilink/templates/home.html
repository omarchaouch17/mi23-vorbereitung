{% extends "base.html" %}

{% block inhalt %}
<div class="lang-switch">
    <a href="/?lang=de">DE</a> | <a href="/?lang=en">EN</a> | <a href="/?lang=fr">FR</a> | <a href="/?lang=ar">AR</a>
</div>
<h1>{{ titel }}</h1>
<h2>{{ patienten_titel }}</h2>
<p><a href="/neu">+ Neuen Patienten hinzufügen</a></p>

{% for name, diagnose, patient_id in patienten %}
<div style="margin: 10px 0;">
    {{ name }} — {{ diagnose }}
    <form action="/loeschen/{{ patient_id }}" method="POST" style="display:inline;"
        onsubmit="return confirm('Patient {{ name }} wirklich löschen?');">
        <button type="submit" style="background:#f87171;">löschen</button>
    </form>
</div>
{% endfor %}
{% endblock %}
