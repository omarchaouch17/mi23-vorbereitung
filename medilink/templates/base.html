<!DOCTYPE html>
<html dir="{{ richtung }}">

<head>
    <title>{{ titel }}</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        h1 {
            color: #38bdf8;
        }

        a {
            color: #94a3b8;
        }

        input {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 8px 20px;
            background-color: #38bdf8;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    {% block inhalt %}{% endblock %}
</body>

</html>
