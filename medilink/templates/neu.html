{% extends "base.html" %}

{% block inhalt %}
<h1>{{ t.neu_titel }}</h1>
{% if fehler %}<div class="fehler-box" role="alert">{{ t.fehler_titel }}</div>{% endif %}
<form action="/hinzufuegen" method="POST" novalidate>
    <input type="hidden" name="lang" value="{{ lang }}">

    <div class="feld">
        <label for="name">{{ t.neu_name }}</label>
        <input type="text" id="name" name="name" maxlength="60" value="{{ werte.get('name', '') }}"
               {% if fehler.get('name') %}class="ungueltig"{% endif %}>
        <div class="fehler" role="alert">{{ fehler.get('name', '') }}</div>
    </div>

    <div class="feld">
        <label for="diagnose">{{ t.neu_diagnose }}</label>
        <select id="diagnose" name="diagnose" {% if fehler.get('diagnose') %}class="ungueltig"{% endif %}>
            <option value="" disabled {% if not werte.get('diagnose_wahl') %}selected{% endif %}>{{ t.waehlen }}</option>
            {% for d in diagnosen %}
            <option value="{{ d }}" {% if werte.get('diagnose_wahl') == d %}selected{% endif %}>{{ diagnose_name(d, lang) }}</option>
            {% endfor %}
            <option value="{{ ANDERE }}" {% if werte.get('diagnose_wahl') == ANDERE %}selected{% endif %}>{{ t.andere }}</option>
        </select>
        <div class="fehler" role="alert">{{ fehler.get('diagnose', '') }}</div>
    </div>

    <div class="feld" id="frei-box">
        <label for="diagnose_frei">{{ t.frei_label }}</label>
        <input type="text" id="diagnose_frei" name="diagnose_frei" maxlength="80"
               value="{{ werte.get('diagnose_frei', '') }}" {% if fehler.get('diagnose_frei') %}class="ungueltig"{% endif %}>
        <div class="fehler" role="alert">{{ fehler.get('diagnose_frei', '') }}</div>
    </div>

    <div class="feld">
        <label for="kategorie">{{ t.neu_kategorie }}</label>
        <select id="kategorie" name="kategorie" {% if fehler.get('kategorie') %}class="ungueltig"{% endif %}>
            <option value="" disabled {% if not werte.get('kategorie') %}selected{% endif %}>{{ t.waehlen }}</option>
            {% for k in kategorien %}
            <option value="{{ k }}" {% if werte.get('kategorie') == k %}selected{% endif %}>{{ kategorie_name(k, lang) }}</option>
            {% endfor %}
        </select>
        <div class="fehler" role="alert">{{ fehler.get('kategorie', '') }}</div>
    </div>

    <button type="submit">{{ t.speichern }}</button>
</form>
<br>
<a href="/?lang={{ lang }}">{{ t.zurueck }}</a>
<script>
// Das freie Textfeld erscheint nur, wenn "Andere" gewaehlt ist (ohne JavaScript bleibt es sichtbar).
(function () {
    var auswahl = document.getElementById('diagnose'), box = document.getElementById('frei-box');
    function umschalten() { box.style.display = (auswahl.value === {{ ANDERE|tojson }}) ? '' : 'none'; }
    auswahl.addEventListener('change', umschalten);
    umschalten();
})();
</script>
{% endblock %}
